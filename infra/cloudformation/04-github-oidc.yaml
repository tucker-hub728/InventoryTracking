AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CellReady IMS — GitHub Actions OIDC trust + least-privilege deploy role.
  Lets GitHub Actions assume an AWS role with NO long-lived access keys.
  Deploy this ONCE per account; the role is reused by every environment.

Parameters:
  ProjectName:
    Type: String
    Default: cellready
  EnvName:
    Type: String
    Default: dev
  GitHubOrg:
    Type: String
    Default: drolle-bdl-arch
    Description: GitHub org/user that owns the repo.
  GitHubRepo:
    Type: String
    Default: InventoryTracking
    Description: Repository name (without the org prefix).
  AllowedBranches:
    Type: CommaDelimitedList
    Default: "main,dev"
    Description: >-
      EXACTLY TWO branches whose workflow runs may assume this role. Keep this
      tight — anyone able to push to these branches can deploy to the
      environment this role targets.
      The trust policy indexes element 0 and element 1, so two values are
      required. For an environment that should trust only ONE branch, repeat it
      (e.g. "production,production") — duplicate conditions are harmless.
      Do NOT leave the default on a production role: it would let any push to
      `dev` deploy to production.
  ExistingOIDCProviderArn:
    Type: String
    Default: ''
    Description: >-
      ARN of a GitHub OIDC provider that already exists in this account. Leave
      BLANK for the first environment (this stack creates one); set it for every
      environment after that.
      An IAM OIDC provider is keyed by its URL and is unique per ACCOUNT, so a
      second stack that tried to create one fails with EntityAlreadyExists.
      Find the existing ARN with:
        aws iam list-open-id-connect-providers
  UseScopedDeployPolicy:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: >-
      'false' (default) attaches the AWS-managed AdministratorAccess-AWSElasticBeanstalk
      policy — broad, but guaranteed to cover every code path EB takes.
      'true' swaps it for the scoped `eb-runtime` policy below, which grants only
      the actions this role was MEASURED using (see that policy's comment).
      Roll this out on dev first and leave prod on 'false' until dev has run
      several releases clean — the measured set covers observed deploys, not
      every possible one. Rollback is this parameter back to 'false'.

Conditions:
  # Only the first environment in an account creates the shared OIDC provider.
  CreateOIDCProvider: !Equals [ !Ref ExistingOIDCProviderArn, '' ]
  ScopedPolicy: !Equals [ !Ref UseScopedDeployPolicy, 'true' ]
  BroadPolicy: !Equals [ !Ref UseScopedDeployPolicy, 'false' ]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # Thumbprints are no longer verified by AWS for this well-known
      # provider, but the field is still required by the API.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvName}-gha-deploy'
      MaxSessionDuration: 3600
      # An EB environment is backed by an internal CloudFormation stack
      # (awseb-e-*-stack) and EC2/ASG/S3 resources; UpdateEnvironment needs to
      # read/modify all of them. This AWS-managed policy grants exactly that —
      # the supported way to avoid enumerating dozens of sub-permissions.
      # ECR push and the CUSTOM artifacts bucket are NOT covered by it, so they
      # remain as the inline policies below.
      #
      # It is also far broader than this role needs: it grants iam, rds,
      # dynamodb, ecs, sns, sqs, cloudtrail, codebuild, codecommit, acm and
      # cloudwatch, none of which a deploy has ever touched. Set
      # UseScopedDeployPolicy=true to drop it for the measured `eb-runtime`
      # policy instead.
      ManagedPolicyArns: !If
        - BroadPolicy
        - [ arn:aws:iam::aws:policy/AdministratorAccess-AWSElasticBeanstalk ]
        - !Ref 'AWS::NoValue'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # The provider this stack created, or the one already in the
              # account — see ExistingOIDCProviderArn.
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only workflow runs on the named branches of THIS repo.
                token.actions.githubusercontent.com:sub:
                  - !Sub
                    - 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${B0}'
                    - B0: !Select [0, !Ref AllowedBranches]
                  - !Sub
                    - 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${B1}'
                    - B1: !Select [1, !Ref AllowedBranches]
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  # Lets the workflow ask "was this commit already built?" so it
                  # can promote an existing image instead of rebuilding and
                  # failing on the immutable tag. Read-only.
                  - ecr:DescribeImages
                Resource:
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/backend'
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}/frontend'
        - PolicyName: eb-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Upload the source bundle (compose + .platform hooks) for each version.
              # GetObjectAcl/PutObjectAcl: EB reads and rewrites the bundle's ACL
              # while staging it — see the comment on the next statement.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectAcl
                  - s3:PutObjectAcl
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-eb-artifacts-${AWS::AccountId}-${EnvName}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-eb-artifacts-${AWS::AccountId}-${EnvName}/*'
              # Elastic Beanstalk's default per-region storage bucket
              # (elasticbeanstalk-<region>-<account>). UpdateEnvironment ensures
              # it exists — s3:CreateBucket is a no-op when it already does, but
              # the API call still requires the permission.
              #
              # Object actions are Get*/Put*/Delete* deliberately, mirroring what
              # AdministratorAccess-AWSElasticBeanstalk grants on this bucket.
              # EB stages the source bundle through here during UpdateEnvironment
              # and reads its ACL; enumerating GetObject/PutObject alone fails the
              # deploy with "You do not have permission to perform the
              # 's3:GetObjectAcl' action" AFTER CreateApplicationVersion has
              # already succeeded, which makes it look like a bundle problem
              # rather than a permissions one. Still one bucket rather than the
              # managed policy's elasticbeanstalk-* across every region.
              - Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:GetBucket*
                  - s3:PutBucketPolicy
                  - s3:ListBucket
                  # These two are in AdministratorAccess-AWSElasticBeanstalk for
                  # a reason: CreateStorageLocation configures the EB bucket's
                  # public-access block and ownership controls, as the CALLER.
                  # Omitting them failed a prod deploy at "Environment update is
                  # starting" with "Service:AmazonCloudFormation, Message:S3
                  # error: Access Denied" — which names neither the bucket nor
                  # the action, so it is worth recording what it meant.
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                Resource: !Sub 'arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}'
              # Enumerating buckets. Cannot be resource-scoped — it is inherently
              # an account-wide list — and is read-only. The managed policy grants
              # it too; EB calls it while locating its storage location.
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:Get*
                  - s3:Put*
                  - s3:Delete*
                Resource: !Sub 'arn:aws:s3:::elasticbeanstalk-${AWS::Region}-${AWS::AccountId}/*'
              # Create a new application version and roll the environment to it.
              - Effect: Allow
                Action:
                  - elasticbeanstalk:CreateApplicationVersion
                  - elasticbeanstalk:CreateStorageLocation
                  - elasticbeanstalk:UpdateEnvironment
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticbeanstalk:DescribeEvents
                  - elasticbeanstalk:DescribeApplicationVersions
                  - elasticbeanstalk:DescribeEnvironmentResources
                Resource: '*'
              # EB UpdateEnvironment needs to pass the instance/service roles.
              - Effect: Allow
                Action:
                  - autoscaling:Describe*
                  - cloudformation:DescribeStackResource*
                  - cloudformation:DescribeStacks
                Resource: '*'
        # Replaces AdministratorAccess-AWSElasticBeanstalk when
        # UseScopedDeployPolicy=true. Every action here was observed in IAM
        # service-last-accessed data (ACTION_LEVEL) for this role — nothing is
        # granted speculatively:
        #   aws iam generate-service-last-accessed-details \
        #     --arn <role-arn> --granularity ACTION_LEVEL
        # Read-only Describe* calls are widened to Describe* rather than pinned
        # to the exact names observed: they leak no data this role cannot
        # already reach, and pinning them makes the policy brittle as EB's
        # internals change between platform versions.
        - !If
          - ScopedPolicy
          - PolicyName: eb-runtime
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # EB drives the deploy by updating its OWN internal stack.
                # Constrained to awseb-* so a compromised workflow cannot
                # rewrite the cellready-* stacks that define the environment,
                # the database or this very role.
                - Effect: Allow
                  Action:
                    - cloudformation:UpdateStack
                    - cloudformation:CancelUpdateStack
                    - cloudformation:GetTemplate
                    - cloudformation:ListStackResources
                    - cloudformation:DescribeStackEvents
                    - cloudformation:DescribeStackResource
                    - cloudformation:DescribeStackResources
                  Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/awseb-*/*'
                # DescribeStacks is not resource-scopable in the way the calls
                # above are — EB lists stacks before it locates its own.
                - Effect: Allow
                  Action: cloudformation:DescribeStacks
                  Resource: '*'
                # Rolling deploys: suspend the ASG's own processes, replace
                # instances a batch at a time, resume. UpdateAutoScalingGroup is
                # how RollingWithAdditionalBatch grows past MinSize.
                - Effect: Allow
                  Action:
                    - autoscaling:Describe*
                    - autoscaling:ResumeProcesses
                    - autoscaling:SuspendProcesses
                    - autoscaling:TerminateInstanceInAutoScalingGroup
                    - autoscaling:UpdateAutoScalingGroup
                  Resource: '*'
                # Read-only. No RunInstances, no security-group writes — the
                # measured data shows five Describe calls and nothing else.
                - Effect: Allow
                  Action: ec2:Describe*
                  Resource: '*'
                # Load-balanced environments only: instances are pulled from the
                # target group before replacement and put back after.
                - Effect: Allow
                  Action:
                    - elasticloadbalancing:Describe*
                    - elasticloadbalancing:RegisterTargets
                    - elasticloadbalancing:DeregisterTargets
                  Resource: '*'
                # EB provisions the environment's log group on first deploy.
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:PutRetentionPolicy
                    - logs:DescribeLogGroups
                  Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/elasticbeanstalk/*'
          - !Ref 'AWS::NoValue'

Outputs:
  DeployRoleArn:
    Description: Set this as the GitHub repo variable DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  OIDCProviderArn:
    Description: >-
      Pass this as ExistingOIDCProviderArn when deploying this template for a
      SECOND environment in the same account.
    Value: !If
      - CreateOIDCProvider
      - !Ref GitHubOIDCProvider
      - !Ref ExistingOIDCProviderArn
