AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CellReady IMS — foundation stack. Stateless/long-lived resources that the
  app and pipeline depend on: ECR repos, the EB artifacts bucket, and a real
  Cognito User Pool (replaces cognito-local in prod).
  NOTE: secret SSM parameters are NOT created here — CloudFormation cannot
  create SecureString parameters. They are seeded by scripts/bootstrap_ssm.sh.

Parameters:
  ProjectName:
    Type: String
    Default: cellready
  EnvName:
    Type: String
    Default: dev
  JwtAccessTtlMinutes:
    Type: Number
    Default: 60
  JwtIdTtlMinutes:
    Type: Number
    Default: 60
  JwtRefreshTtlDays:
    Type: Number
    Default: 30
  CreateEcrRepos:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether this stack owns the two ECR repositories. Set 'true' for the FIRST
      environment in an account and 'false' for every one after it.
      The repositories are deliberately named without the environment
      (cellready/backend), so every environment shares one registry and images are
      distinguished by their commit-SHA tag. That is what lets a build tested in
      dev be promoted to prod as the identical artifact instead of rebuilt. But an
      ECR repository name is unique per account+region, so a second stack that
      tried to create them would fail with RepositoryAlreadyExists and roll back.
      Set 'false' and this stack reuses whatever is already there.

Conditions:
  # Only the first environment in an account creates the shared registries.
  ManageEcr: !Equals [ !Ref CreateEcrRepos, 'true' ]

Resources:
  # ── Container registries ────────────────────────────────────────────────
  BackendRepo:
    Type: AWS::ECR::Repository
    Condition: ManageEcr
    Properties:
      RepositoryName: !Sub '${ProjectName}/backend'
      ImageScanningConfiguration:
        ScanOnPush: true
      # IMMUTABLE so a pushed tag can never be repointed. Deploys tag by
      # github.sha, so "deployed commit X" must keep meaning the artifact
      # built from X — a mutable tag lets any ecr:PutImage holder swap the
      # released image out from under a SHA and defeats rollback provenance.
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  FrontendRepo:
    Type: AWS::ECR::Repository
    Condition: ManageEcr
    Properties:
      RepositoryName: !Sub '${ProjectName}/frontend'
      ImageScanningConfiguration:
        ScanOnPush: true
      # See BackendRepo — immutable tags for artifact provenance.
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # NOTE: the e-signature bucket is gone from this template as of 2026-08-03.
  # It held the hand-drawn signature image, which was removed from the product
  # (an electronic signature here is the password re-authentication).
  #
  # It carried DeletionPolicy: Retain, so removing it from the template ORPHANS
  # rather than deletes it — the bucket and any objects stay in the account,
  # unmanaged, which is what we want while Part 11 retention applies. Delete it
  # by hand once retention has expired.
  #
  # DEPLOY ORDER: update 03-beanstalk FIRST (it imports SignaturesBucketArn);
  # CloudFormation will not remove an Export that something still imports.

  # ── S3: Elastic Beanstalk source bundles (compose + .platform hooks) ─────
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-eb-artifacts-${AWS::AccountId}-${EnvName}'
      # This bucket holds every EB source bundle — the compose file and the
      # .platform prebuild hook, i.e. the code that runs on the instance.
      # Versioning makes a tampered or clobbered bundle recoverable and
      # detectable; without it an overwrite of a key is silent and final.
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-bundles
            Status: Enabled
            # Versioning is on, so expire noncurrent versions too — otherwise
            # every superseded bundle is retained forever and the rule below
            # only ever moves the current version to noncurrent.
            NoncurrentVersionExpirationInDays: 90
            ExpirationInDays: 90

  # ── S3: TLS-only access policy ──────────────────────────────────────────
  # The artifacts bucket did not deny cleartext requests. It holds the EB
  # source bundle — the compose file and the .platform prebuild hook, i.e.
  # the code that runs on the instance — so refuse any request that did not
  # arrive over TLS rather than relying on callers to opt in.
  #
  # (The matching policy for the signatures bucket went with the bucket; if
  # you retain that bucket manually, attach an equivalent deny to it there.)
  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTlsRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ── Cognito User Pool (real auth backend for prod) ──────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvName}'
      # No EmailConfiguration block => Cognito uses its built-in default email
      # sender (COGNITO_DEFAULT), NOT Amazon SES. That is the intended prod
      # transport for invitation emails — see backend EMAIL_VIA_APP (false in
      # prod: Cognito sends the invite; true in local dev: the app sends it to
      # maildev because cognito-local can't email).
      #
      # Admins create users (admin-create-user); no public self sign-up. The
      # invite message template carries the one-time temporary password the
      # invitee uses to complete the standard Accept Invitation flow (sign in
      # with the temp password, then set a new one).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "You've been invited to CellReady IMS"
          EmailMessage: |
            <p>Hi,</p>
            <p>You've been invited to CellReady IMS. To finish setting up your account, sign in with your email and the temporary password below, then choose a new password when prompted.</p>
            <p><strong>Email:</strong> {username}<br/>
            <strong>Temporary password:</strong> {####}</p>
            <p>If you weren't expecting this invitation you can ignore this email.</p>
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      # Custom attributes the backend reads from the ID token
      # (app/auth/provisioning.py: custom:role, custom:initials).
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: '0'
            MaxLength: '32'
        - Name: initials
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: '0'
            MaxLength: '8'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${EnvName}-backend'
      UserPoolId: !Ref UserPool
      # Backend confidential client with no secret (matches the dev flow);
      # USER_PASSWORD_AUTH is used by the FastAPI login endpoint.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      # Token TTLs mirror the backend/frontend JWT_* settings.
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AccessTokenValidity: !Ref JwtAccessTtlMinutes
      IdTokenValidity: !Ref JwtIdTtlMinutes
      RefreshTokenValidity: !Ref JwtRefreshTtlDays

Outputs:
  # Conditional along with the repositories themselves — an Output referencing a
  # resource that was not created is a template error, not an empty string.
  # Nothing imports these (deploy.yml composes the registry URL from account +
  # region), so a stack with CreateEcrRepos=false simply omits them.
  BackendRepoUri:
    Condition: ManageEcr
    Value: !GetAtt BackendRepo.RepositoryUri
    Export: { Name: !Sub '${ProjectName}-${EnvName}-BackendRepoUri' }
  FrontendRepoUri:
    Condition: ManageEcr
    Value: !GetAtt FrontendRepo.RepositoryUri
    Export: { Name: !Sub '${ProjectName}-${EnvName}-FrontendRepoUri' }
  # SignaturesBucketName / SignaturesBucketArn exports removed 2026-08-03 with
  # the bucket. Nothing imports them any more (03-beanstalk was updated in the
  # same change) — see the DEPLOY ORDER note above before rolling this out.
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export: { Name: !Sub '${ProjectName}-${EnvName}-ArtifactsBucket' }
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub '${ProjectName}-${EnvName}-UserPoolId' }
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: { Name: !Sub '${ProjectName}-${EnvName}-UserPoolArn' }
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export: { Name: !Sub '${ProjectName}-${EnvName}-UserPoolClientId' }
