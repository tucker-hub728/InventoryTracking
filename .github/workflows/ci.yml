name: CI

on:
  pull_request:
  push:
    branches: [dev]
  # Callable by the deploy workflow: a push to main runs lint FIRST,
  # and only deploys if it passes. (main is intentionally not in the push
  # list above so CI doesn't run twice on main.)
  workflow_call:

# Actions are pinned to commit SHAs, not tags. A tag like @v4 is mutable —
# the owner (or anyone who compromises the account) can repoint it and every
# workflow silently runs different code on the next run. The trailing comment
# records which release each SHA is, so Dependabot can bump them readably.
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node the PROJECT is built with — unrelated to the Node the
          # action itself runs on (node24 since v5). Match frontend/Dockerfile:
          # Next 16's dev deps want >=20.19.
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
