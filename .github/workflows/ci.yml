name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cellready
          POSTGRES_PASSWORD: cellready_dev_only
          POSTGRES_DB: cellready_ims
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cellready -d cellready_ims"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-32-chars-minimum-aaaa
      DATABASE_URL: postgresql+asyncpg://cellready:cellready_dev_only@localhost:5432/cellready_ims
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type-check (mypy)
        run: uv run mypy app
      - name: Tests (pytest)
        # If tests need MinIO/cognito-local, add them as `services` above.
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
